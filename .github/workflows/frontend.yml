name: Frontend CI-CD

on:
  workflow_dispatch:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm run test -- --run

      - name: Build Frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Archive Frontend Build
        run: tar -czf frontend-dist.tar.gz dist

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: frontend/frontend-dist.tar.gz

  sonar-scan:
    needs: build-test
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Run SonarQube Scan
        working-directory: frontend
        run: |
          npm ci
          npx sonar-scanner \
            -Dsonar.projectKey=frontend \
            -Dsonar.sources=src \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}

  deploy:
    needs: [build-test, sonar-scan]
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Frontend Artifact
        uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: /home/azureuser/artifacts/frontend

      - name: Deploy Frontend with Ansible
        run: |
          cd /home/azureuser/config/ansible
          ansible-playbook playbooks/frontend.yml

      - name: Validate Frontend Direct
        run: curl -I http://10.20.2.4/

      - name: Validate Through App Gateway
        run: curl -I http://20.205.212.128/
