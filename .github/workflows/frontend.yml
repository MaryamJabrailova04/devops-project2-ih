name: Frontend CI-CD

on:
  workflow_dispatch:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm run test -- --run

      - name: Build Frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Archive Frontend Build
        run: tar -czf frontend-dist.tar.gz dist

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: frontend/frontend-dist.tar.gz

  sonar-scan:
    needs: build-test
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Debug runner tools
        run: |
          echo "HOSTNAME=$(hostname)"
          echo "USER=$(whoami)"
          echo "PATH=$PATH"
          which unzip || true
          unzip -v || true
          which curl || true
          which wget || true

      - name: Install scanner prerequisites
        run: |
          sudo apt update
          sudo apt install -y unzip curl wget

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7.1.0
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.projectKey=frontend
            -Dsonar.sources=src
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy:
    needs: [build-test, sonar-scan]
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Frontend Artifact
        uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: /home/azureuser/artifacts/frontend

      - name: Deploy Frontend with Ansible
        run: |
          cd /home/azureuser/config/ansible
          ansible-playbook playbooks/frontend.yml

      - name: Validate Frontend Direct
        run: curl -I http://10.20.2.4/

      - name: Validate Through App Gateway
        run: curl -I http://20.205.212.128/
