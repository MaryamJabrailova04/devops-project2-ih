name: Backend CI-CD

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-test-sonar:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build, Test & SonarQube Scan
        run: |
          mvn clean verify sonar:sonar \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar

  deploy:
    needs: build-test-sonar
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: /home/azureuser/artifacts/backend

      - name: Rename JAR
        run: |
          cd /home/azureuser/artifacts/backend
          JAR_FILE=$(ls *.jar | head -n 1)
          cp "$JAR_FILE" backend.jar

      - name: Deploy Backend with Ansible
        run: |
          cd /home/azureuser/config/ansible
          ansible-playbook playbooks/backend.yml

      - name: Validate Backend Direct
        run: curl http://10.20.3.4:8080/api/health

      - name: Validate Through App Gateway
        run: curl http://20.205.212.128/api/orders/history
