name: Terraform Infra

on:
  workflow_dispatch:

env:
  TF_IN_AUTOMATION: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  terraform:
    runs-on: self-hosted

    defaults:
      run:
        shell: bash
        working-directory: /home/azureuser/project-group4/infra/terraform

    steps:
      - name: Verify Terraform
        run: terraform version

      - name: Show Current Workspace
        run: terraform workspace show

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          set +e
          terraform plan -detailed-exitcode -out=tfplan
          exitcode=$?
          echo "exitcode=$exitcode" >> "$GITHUB_OUTPUT"
          if [ "$exitcode" -eq 1 ]; then
            echo "Terraform plan failed"
            exit 1
          fi
          exit 0

      - name: Show Plan Result
        run: |
          if [ "${{ steps.plan.outputs.exitcode }}" = "0" ]; then
            echo "No infrastructure changes detected."
          elif [ "${{ steps.plan.outputs.exitcode }}" = "2" ]; then
            echo "Infrastructure changes detected."
          fi

      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch' && steps.plan.outputs.exitcode == '2'
        run: terraform apply -auto-approve tfplan
